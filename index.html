<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Shop</title>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <h1>DevShop</h1>
      <!-- Recherche article -->
      <input
        type="search"
        name="input-search"
        id="input-search"
        placeholder="Rechercher..."
      />
      <!-- Panier d'achat -->
      <section class="cart-section">
        <span id="compteur"></span>
        <button type="button" id="btn-cart">
          <i class="fa-solid fa-cart-shopping"></i>
        </button>
      </section>
    </header>

    <main class="main">
      <section>
        <h2>Produits</h2>
        <!-- Bouton de filtre -->
        <section class="btn-filter">
          <button type="button" id="all">Tous</button>
          <button type="button" id="mens-clothes" name="men's clothing">
            Vêtements hommes
          </button>
          <button type="button" id="womens-clothes" name="women's clothing">
            Vêtements femmes
          </button>
          <button type="button" id="jewels" name="jewelery">bijoux</button>
          <button type="button" id="electronics" name="electronics">
            Electroniques
          </button>
        </section>

        <section id="products" class="block"></section>
      </section>

      <aside id="cart-tiroir" class="cart-tiroir">
        <header class="cart-header">
          <h2>Panier d'achat</h2>
          <button type="button" id="close-cart">
            <i class="fa-solid fa-x"></i>
          </button>
        </header>
        <section id="cart-content">
          <p>Total :<span id="cart-total"></span></p>
        </section>
        <footer class="cart-footer"></footer>
      </aside>
    </main>
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-brand">
          <h2>DevShop</h2>
          <p>Retrouvez vos produits préférés simplement et rapidement.</p>
        </div>

        <div class="footer-contact">
          <h3>Contact</h3>

          <a href="#"> contact@devshop.com </a>

          <a href="tel:+242060000000"> +242 06 430 20 20 </a>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 DevShop. Tous droits réservés.</p>
      </div>
    </footer>

    <!--  -->
    <script src="index.js"></script>
  </body>
</html>
