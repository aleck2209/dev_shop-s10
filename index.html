<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Shop</title>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <h1>DevShop</h1>
      <!-- Recherche article -->
      <input
        type="search"
        name="input-search"
        id="input-search"
        placeholder="Rechercher..."
      />
      <!-- Panier d'achat -->
      <button type="button"><i class="fa-solid fa-cart-shopping"></i></button>
    </header>

    <main class="main">
      <section>
        <h2>Produits</h2>
        <!-- Bouton de filtre -->
        <section class="btn-filter">
          <button type="button" id="mens-clothes" name="men's clothing">
            Vêtements hommes
          </button>
          <button type="button" id="womens-clothes" name="women's clothing">
            Vêtements femmes
          </button>
          <button type="button" id="jewels" name="jewelery">bijoux</button>
          <button type="button" id="electronics" name="electronics">
            Electroniques
          </button>
        </section>

        <section id="products" class="block"></section>
      </section>
    </main>
    <footer></footer>

    <!--  -->
    <script src="index.js"></script>
  </body>
</html>
